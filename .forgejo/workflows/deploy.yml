name: Deploy Hugo User Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: codeberg-tiny

    container:
      image: hugomods/hugo:exts

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build site
        run: hugo --minify

      - name: Deploy to pages branch
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@codeberg.org"

          # Create a temporary deploy directory
          mkdir deploy
          cp -r public/* deploy/
          touch deploy/.nojekyll
          
          # Switch to pages branch
          git fetch origin
          git checkout pages || git checkout --orphan pages

          # Remove everything except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy built files back
          cp -r deploy/* .

          git add .
          git commit -m "Deploy site" || echo "No changes to commit"
          git push origin pages --force