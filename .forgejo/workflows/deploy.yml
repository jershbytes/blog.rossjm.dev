name: Deploy Hugo User Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: codeberg-tiny

    container:
      image: hugomods/hugo:exts

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build site
        run: hugo --minify

      - name: Deploy to pages branch
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@codeberg.org"

          # Create a worktree for pages branch
          git fetch origin
          git worktree add -B pages pages-worktree origin/pages || \
          git worktree add -b pages pages-worktree

          # Clear old files
          rm -rf pages-worktree/*

          # Copy new build output
          cp -r public/* pages-worktree/
          touch pages-worktree/.nojekyll

          # Commit and push
          cd pages-worktree
          git add .
          git commit -m "Deploy site" || echo "No changes to commit"
          git push origin pages --force