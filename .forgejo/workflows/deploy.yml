name: Deploy Hugo User Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: codeberg-tiny

    container:
      image: hugomods/hugo:exts

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Hugo version
        run: hugo version

      - name: Clean Hugo caches and generated files
        run: |
          set -e
          # Remove previously generated resources and output
          rm -rf public resources/_gen || true
          # Remove Hugo cache (user cache dir may differ on the runner)
          rm -rf ~/.cache/hugo || true
          # Clean Hugo modules cache
          hugo mod clean || true

      - name: Build site (no cache)
        env:
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --gc \
            --ignoreCache \
            --enableGitInfo \
            --baseURL "https://blog.rossjm.dev/"

      - name: Deploy to pages branch
        run: |
          set -e

          git config user.name "forgejo-actions"
          git config user.email "actions@codeberg.org"

          git fetch origin
          git worktree add -B pages pages-worktree origin/pages || \
          git worktree add -b pages pages-worktree

          rm -rf pages-worktree/*

          cp -r public/. pages-worktree/
          touch pages-worktree/.nojekyll

          cd pages-worktree
          git add .
          git commit -m "Deploy site" || exit 0
          git push origin pages --force