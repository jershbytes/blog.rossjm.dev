# If your site is in 'https', make sure the base URL is also https so sitemap
# URLs use the correct scheme.
baseURL = "https://blog.rossjm.dev"
title = "/home/jersh"
theme = "mana"

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
mainsections = ["posts"]
defaultContentLanguage = "en"

#  Favicon configuration (optional)
#   Keep `params.favicon` above for simple setups; use this block if you want full control.
  [params.favicons]
    ico = "/favicon.ico"
    png = "/favicon-96x96.png"
    png16 = "/favicon-16x16.png"
    png32 = "/favicon-32x32.png"
    apple180 = "/apple-touch-icon.png"
    android192 = "/web-app-manifest-192x192.png"
    android512 = "/android-chrome-512x512.png"
    manifest = "/site.webmanifest"

[pagination]
  disableAliases = false
  pageSize = 5

[languages.en]
  label = "English"
  weight = 1

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 15

[[menus.main]]
  name = "Posts"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "Resume"
  pageRef = "/resume"
  weight = 25

[[menus.main]]
  name = "Links"
  url = "https://links.rossjm.net/"
  weight = 30

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms"]

[minify]
  disableXML = true

[params]
  description = "Personal website and blog of Jersh."
  author = "Jersh"
  heroTitleLine1 = "Hi, I'm Jersh"
  relatedPostsCount = 3

  [params.social]
    github = "https://github.com/jershbytes"
    email = "contact@rossjm.dev"

  [params.avatar.home]
    assetPath = "img/author.jpg"

  [params.avatar.about]
    assetPath = "img/author.jpg"

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    owner = "JershBytes"

  [params.admonitions]
    alertStyle = "favicon"

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser.attribute]
      block = true
      title = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[services.instagram]
  disableInlineCSS = true

[services.x]
  disableInlineCSS = true